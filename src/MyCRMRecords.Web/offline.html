<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <title>Offline · MyCRMRecords</title>
  <!-- Shown by sw.js when MyCRMRecords cannot be reached. Everything is inline: nothing else may be available. -->
  <style>
    :root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--text:#111114;--text-2:#5b5f69;--accent:#0a58f0}
    @media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--text-2:#a1a1aa;--accent:#3d82ff}}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif}
    main{max-width:420px;border-radius:24px;background:var(--card);padding:28px 24px;text-align:center}
    h1{margin:0 0 8px;font-size:24px;font-weight:800;letter-spacing:-.02em}
    p{margin:0 0 20px;color:var(--text-2)}
    button{height:46px;padding:0 22px;border:0;border-radius:23px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>MyCRMRecords can't be reached</h1>
    <p>Check that you're connected to the network (and to the VPN when you're away from the office), then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
